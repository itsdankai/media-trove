# Copy .env.example to .env and add your TMDB key, then: docker compose up -d
# Open http://localhost:8787. Your library lives in ./data (back that folder up).
services:
  mediatrove:
    image: ghcr.io/itsdankai/media-trove:latest
    # To build from this folder instead of pulling the published image, replace the line above with:
    # build: .
    container_name: mediatrove
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "8787:8787"
    volumes:
      - ./data:/data
